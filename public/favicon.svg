<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Base dark-violet squircle aligned with color-ground (#020617) and brand (#2E1065) -->
    <radialGradient id="ph-bg" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Subtle border highlight in brand violet (#8B5CF6 / #C084FC) -->
    <linearGradient id="ph-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Playing card surface gradient -->
    <linearGradient id="ph-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Vibrant party die gradient (Violet -> Pink/Fuchsia) -->
    <linearGradient id="ph-die" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="ph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ph-bg)" stroke="url(#ph-border)" stroke-width="2" />

  <!-- Back Playing Card (tilted left, cyan accent spark) -->
  <g transform="rotate(-14 23 29)" filter="url(#ph-shadow)">
    <rect x="10" y="11" width="25" height="35" rx="5.5" fill="url(#ph-card)" stroke="#38BDF8" stroke-width="2" />
    <path d="M22.5 20.5 L24.6 26.4 L30.5 28.5 L24.6 30.6 L22.5 36.5 L20.4 30.6 L14.5 28.5 L20.4 26.4 Z" fill="#22D3EE" />
  </g>

  <!-- Front Party Die (tilted right, violet/pink gradient with crisp pips) -->
  <g transform="rotate(10 41 37)" filter="url(#ph-shadow)">
    <rect x="27" y="23" width="28" height="28" rx="7" fill="url(#ph-die)" stroke="#F5D0FE" stroke-width="1.75" />
    <circle cx="34" cy="30" r="2.6" fill="#F8FAFC" />
    <circle cx="48" cy="30" r="2.6" fill="#F8FAFC" />
    <circle cx="41" cy="37" r="2.9" fill="#FBBF24" />
    <circle cx="34" cy="44" r="2.6" fill="#F8FAFC" />
    <circle cx="48" cy="44" r="2.6" fill="#F8FAFC" />
  </g>

  <!-- Top-right Amber Spark (Ludo/Hanabi gold accent) -->
  <path d="M48 9 L49.4 12.6 L53 14 L49.4 15.4 L48 19 L46.6 15.4 L43 14 L46.6 12.6 Z" fill="#FBBF24" />
</svg>
