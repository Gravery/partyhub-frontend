services:
  frontend:
    build:
      context: ..
      dockerfile: devops/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3333}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3333/ws}
    container_name: partyhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - partyhub-net

networks:
  partyhub-net:
    driver: bridge
