<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="itto-bg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="itto-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#itto-bg)"/>

  <!-- Telepathic Aura Circles -->
  <g fill="none" stroke="#a855f7" opacity="0.25">
    <circle cx="300" cy="180" r="140" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="300" cy="180" r="190" stroke-width="1"/>
    <circle cx="300" cy="180" r="240" stroke-width="1" stroke-dasharray="12,12"/>
  </g>

  <!-- Glowing Shuriken Star (Ninja Star Life token) -->
  <g transform="translate(110, 80) scale(0.8)" filter="url(#itto-glow)">
    <polygon points="40,10 50,30 70,40 50,50 40,70 30,50 10,40 30,30" fill="#facc15"/>
    <circle cx="40" cy="40" r="5" fill="#1e1b4b"/>
  </g>

  <!-- Hearts / Life Tokens -->
  <g transform="translate(480, 80)">
    <path d="M 0 0 C -12 -12 -28 5 0 25 C 28 5 12 -12 0 0 Z" fill="#ef4444" filter="url(#itto-glow)"/>
  </g>

  <!-- Ascending Floating Cards: 42, 67, 89 -->
  <!-- Card 1: 42 -->
  <g transform="translate(150, 110) rotate(-14)" filter="url(#itto-glow)">
    <rect width="100" height="150" rx="12" fill="url(#card-grad)" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="8" y="8" width="84" height="134" rx="8" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>
    <text x="50" y="90" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">42</text>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#e0e7ff">42</text>
  </g>

  <!-- Card 2: 67 -->
  <g transform="translate(250, 90) rotate(2)" filter="url(#itto-glow)">
    <rect width="105" height="155" rx="12" fill="#4338ca" stroke="#e0e7ff" stroke-width="2.5"/>
    <rect x="8" y="8" width="89" height="139" rx="8" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.6"/>
    <text x="52" y="95" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">67</text>
    <text x="20" y="34" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#e0e7ff">67</text>
  </g>

  <!-- Card 3: 89 -->
  <g transform="translate(360, 120) rotate(16)" filter="url(#itto-glow)">
    <rect width="100" height="150" rx="12" fill="url(#card-grad)" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="8" y="8" width="84" height="134" rx="8" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>
    <text x="50" y="90" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">89</text>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#e0e7ff">89</text>
  </g>

  <!-- Mind Energy Connection Beam -->
  <path d="M 120 280 Q 300 240 480 280" stroke="#c084fc" stroke-width="3" fill="none" stroke-dasharray="4,8" opacity="0.7"/>
</svg>
