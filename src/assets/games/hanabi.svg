<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="sky-grad" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#090d24"/>
      <stop offset="100%" stop-color="#02040d"/>
    </radialGradient>
    <radialGradient id="firework-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="firework-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#sky-grad)"/>

  <!-- Stars in sky -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="50" cy="50" r="1.5"/><circle cx="120" cy="80" r="1"/><circle cx="480" cy="40" r="1.5"/><circle cx="530" cy="90" r="1"/>
    <circle cx="280" cy="30" r="1.5"/><circle cx="340" cy="65" r="1"/><circle cx="70" cy="180" r="1"/><circle cx="510" cy="210" r="1.5"/>
  </g>

  <!-- Big Red/Gold Firework burst -->
  <g transform="translate(220, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="80" fill="url(#firework-red)"/>
    <!-- Firework spark trails -->
    <path d="M 0 0 L 0 -70 M 0 0 L 0 70 M 0 0 L -70 0 M 0 0 L 70 0" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 0 L -50 -50 M 0 0 L 50 50 M 0 0 L 50 -50 M 0 0 L -50 50" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L -25 -65 M 0 0 L 25 65 M 0 0 L 65 -25 M 0 0 L -65 25" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Cyan/Blue Firework burst -->
  <g transform="translate(420, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="60" fill="url(#firework-blue)"/>
    <path d="M 0 0 L 0 -55 M 0 0 L 0 55 M 0 0 L -55 0 M 0 0 L 55 0" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L -40 -40 M 0 0 L 40 40 M 0 0 L 40 -40 M 0 0 L -40 40" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Mini Yellow/Green sparks -->
  <g transform="translate(100, 190)" filter="url(#glow)">
    <circle cx="0" cy="0" r="4" fill="#4ade80"/>
    <path d="M 0 0 L 0 -25 M 0 0 L 20 20 M 0 0 L -20 20" stroke="#86efac" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 5 Hanabi Cards fanned at bottom -->
  <g transform="translate(150, 240)">
    <!-- White Card -->
    <g transform="translate(0, 20) rotate(-16)">
      <rect width="64" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#475569">1</text>
    </g>
    <!-- Blue Card -->
    <g transform="translate(60, 6) rotate(-8)">
      <rect width="64" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="14" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#38bdf8">2</text>
    </g>
    <!-- Green Card -->
    <g transform="translate(125, 0) rotate(0)">
      <rect width="64" height="96" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
      <text x="14" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#22c55e">3</text>
    </g>
    <!-- Yellow Card -->
    <g transform="translate(190, 6) rotate(8)">
      <rect width="64" height="96" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
      <text x="14" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#eab308">4</text>
    </g>
    <!-- Red Card -->
    <g transform="translate(250, 20) rotate(16)">
      <rect width="64" height="96" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="14" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#ef4444">5</text>
    </g>
  </g>

  <!-- Title Kanji / Brand Accent -->
  <text x="50" y="80" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">HANABI</text>
  <text x="52" y="105" font-family="sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">花火 • COOPERATIVO</text>
</svg>
